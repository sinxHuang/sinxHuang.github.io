---
layout: default
---

<div class="row">
    <aside class="col-lg-3 d-none d-lg-block">
        <div class="card border-0 shadow-sm bg-white post-toc-card">
            <div class="card-body p-3">
                <div class="post-toc-title">On This Page</div>
                <nav id="post-toc" class="post-toc-nav"></nav>
            </div>
        </div>
    </aside>
    <div class="col-lg-9">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4 p-md-5">
                <h2 class="mb-2 blog-title">{{ page.title }}</h2>
                <div class="post-meta text-muted mb-2">
                    {{ page.date | date: "%b %-d, %Y" }}
                </div>
                {% if page.tags and page.tags.size > 0 %}
                <div class="post-tags mb-3">
                    {% for tag in page.tags %}
                        <span class="badge border post-tag">{{ tag }}</span>
                    {% endfor %}
                </div>
                {% endif %}
                <hr />
                <div class="post-content" id="post-content">
                    {{ content }}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var content = document.getElementById("post-content");
    var toc = document.getElementById("post-toc");
    if (!content || !toc) return;

    var headings = Array.prototype.slice.call(content.querySelectorAll("h1, h2, h3"));
    if (!headings.length) {
        toc.innerHTML = '<div class="text-muted small">No sections</div>';
        return;
    }

    var links = [];
    var groups = [];
    var usedIds = {};
    var currentGroup = null;
    var activeHeadingId = "";

    function normalizeHeadingText(text) {
        return (text || "")
            .replace(/\s*\((?:P?\d[\d\s,~\-]*)\)\s*$/u, "")
            .replace(/\s*\*+\s*$/u, "")
            .replace(/\s+/g, " ")
            .trim();
    }

    function setGroupExpanded(group, expanded) {
        if (!group || !group.root || !group.toggle) return;
        group.root.classList.toggle("collapsed", !expanded);
        group.toggle.setAttribute("aria-expanded", expanded ? "true" : "false");
    }

    headings.forEach(function (heading) {
        var rawText = (heading.textContent || "").trim();
        var text = normalizeHeadingText(rawText);
        if (!text) return;

        if (!heading.id) {
            var base = text.toLowerCase()
                .replace(/[^\w\u4e00-\u9fa5\- ]+/g, "")
                .trim()
                .replace(/\s+/g, "-");
            if (!base) base = "section";

            var id = base;
            var suffix = 2;
            while (document.getElementById(id) || usedIds[id]) {
                id = base + "-" + suffix;
                suffix += 1;
            }
            heading.id = id;
            usedIds[id] = true;
        }

        var link = document.createElement("a");
        link.href = "#" + heading.id;
        link.textContent = text;
        var levelClass = "toc-level-2";
        if (heading.tagName === "H1") levelClass = "toc-level-1";
        if (heading.tagName === "H3") levelClass = "toc-level-3";
        link.className = "post-toc-link " + levelClass;

        var groupForItem = currentGroup;

        if (heading.tagName === "H1") {
            var group = document.createElement("section");
            group.className = "post-toc-group";

            var header = document.createElement("div");
            header.className = "post-toc-group-header";

            var toggle = document.createElement("button");
            toggle.type = "button";
            toggle.className = "post-toc-group-toggle";
            toggle.setAttribute("aria-label", "Toggle section");
            toggle.setAttribute("aria-expanded", "true");

            var children = document.createElement("div");
            children.className = "post-toc-group-children";

            toggle.addEventListener("click", function () {
                var collapsed = group.classList.contains("collapsed");
                setGroupExpanded(currentGroupMap.get(group), collapsed);
            });

            header.appendChild(toggle);
            header.appendChild(link);
            group.appendChild(header);
            group.appendChild(children);
            toc.appendChild(group);

            currentGroup = {
                root: group,
                header: header,
                toggle: toggle,
                children: children,
                link: link
            };
            groups.push(currentGroup);
            groupForItem = currentGroup;
        } else if (currentGroup) {
            currentGroup.children.appendChild(link);
            groupForItem = currentGroup;
        } else {
            toc.appendChild(link);
            groupForItem = null;
        }

        links.push({ heading: heading, link: link, group: groupForItem });
    });

    var currentGroupMap = new Map();
    groups.forEach(function (group) {
        currentGroupMap.set(group.root, group);
        if (!group.children.childElementCount) {
            group.root.classList.add("group-leaf");
            group.toggle.hidden = true;
        }
    });

    function updateActive() {
        var current = links[0] || null;
        var offset = window.scrollY + 130;

        links.forEach(function (item) {
            if (item.heading.offsetTop <= offset) {
                current = item;
            }
        });

        links.forEach(function (item) {
            item.link.classList.toggle("active", current && item.heading.id === current.heading.id);
        });

        if (!current) return;

        if (current.group) {
            setGroupExpanded(current.group, true);
        }

        if (activeHeadingId !== current.heading.id) {
            activeHeadingId = current.heading.id;
            current.link.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
    }

    window.addEventListener("scroll", updateActive, { passive: true });
    updateActive();
});
</script>
