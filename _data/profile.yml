short_bio: >-
  <p>
    👋 Hi, I'm <strong>HUANG Xuan</strong>, an incoming Ph.D. student at
    <span class="profile-accent">Shanghai Jiao Tong University</span>
    under the supervision of Prof.
    <a href="https://guolusjtu.github.io/guoluhomepage/" target="_blank">Guo Lu</a>.
    Previously, I received my B.Eng. in Communication Engineering from
    <span class="profile-accent">University of Electronic Science and Technology of China</span>
    in June 2026.
  </p>
  <p>
    🔬 My research focuses on <span class="profile-accent">Multimodal Large Language Models</span> and
    <span class="profile-accent">Efficient AI</span>, and I am particularly interested in
    <span class="profile-accent">Real-Time Streaming MLLMs</span> and
    <span class="profile-accent">Multimodal Agents</span>.
    I am seeking internship and collaboration opportunities.
    Please feel free to contact me!
  </p>
  <p>
    💼 I am currently working at <span class="profile-accent">Ant Group</span> as an AI Coding research intern.
  </p>

