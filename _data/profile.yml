short_bio: >-
  <p>
    👋 Hi, I'm <strong>HUANG Xuan</strong>, an undergraduate student majoring in Communication Engineering at
    <span class="profile-accent">University of Electronic Science and Technology of China</span>,
    under the supervision of Prof.
    <a href="https://faculty.uestc.edu.cn/meiweidong/zh_CN/index/478547/list/index.htm" target="_blank">Weidong Mei</a>,
    expected to graduate in June 2026.
  </p>
  <p>
    🎓 I will begin my Ph.D. journey in September 2026 at
    <span class="profile-accent">Shanghai Jiao Tong University</span>, joining the
    <a href="https://medialab.sjtu.edu.cn/" target="_blank">Media Lab</a>
    under the supervision of Prof.
    <a href="https://guolusjtu.github.io/guoluhomepage/" target="_blank">Guo Lu</a>.
  </p>
  <p>
    🔎 Currently, my research interests focus on
    <span class="profile-accent">⚡ acceleration for multimodal large models, especially efficient token compression</span>.
  </p>
  <p>
    💬 Outside research, I enjoy 📖 reading, 🎸 listening to music, and 🎮 playing RPG and AVG games.
  </p>

